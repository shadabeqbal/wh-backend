name: Deploy to Cloud Run      # Workflow name

on:                            # Trigger condition
  push:
    branches:
      - main                   # Runs only on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest     # Runner machine

    steps:                     # Each step runs in order
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      # Add deployment steps here
